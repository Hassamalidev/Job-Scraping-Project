[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intel"
version = "1.0.0"
description = "Multi-source job market scraping pipeline with skill and salary analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["web-scraping", "etl", "data-pipeline", "fastapi", "job-market", "analytics"]

dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
jmi = "jmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jmi = ["api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a function call in the default value.
"src/jmi/api/*.py" = ["B008"]
