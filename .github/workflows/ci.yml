name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      # The pipeline must work end to end without touching the network.
      - name: Smoke test the CLI
        run: |
          jmi init
          jmi stats || true
          jmi export --format json --out /tmp/jobs.json || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t job-market-intel:ci .
      - name: Verify the API boots
        run: |
          docker run -d --name jmi -p 8000:8000 job-market-intel:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs jmi
          exit 1
